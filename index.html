<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ORBIT</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            margin-bottom: 35px;
        }

        p {
            font-size: 17px;
            line-height: 2;
        }

        input {
            width: 220px;
            max-width: 80%;
            padding: 12px;
            margin-top: 15px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            outline: none;
            text-align: center;
            font-size: 18px;
            box-sizing: border-box;
        }

        button {
            display: block;
            margin: 18px auto 0;
            padding: 10px 28px;
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .hint {
            margin-top: 28px;
            font-size: 13px;
            color: #888;
        }

        .error {
            margin-top: 18px;
            color: #aaa;
            font-size: 14px;
            min-height: 20px;
        }

        #nextStage {
            display: none;
        }

        #nextStage p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="login">
            <h1>برای ورود به سایت، رمز را وارد کنید.</h1>

            <input
                type="text"
                id="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="رمز"
            >

            <button id="enter">ورود</button>

            <div class="hint">
                راهنمایی: عدد داخل طیف‌نگار
            </div>

            <div class="error" id="error"></div>
        </div>


        <div id="nextStage">
            <p id="nextText"></p>
        </div>

    </div>


    <script>
        const passwordInput = document.getElementById("password");
        const enterButton = document.getElementById("enter");
        const error = document.getElementById("error");

        const login = document.getElementById("login");
        const nextStage = document.getElementById("nextStage");
        const nextText = document.getElementById("nextText");

        function checkPassword() {

            if (passwordInput.value === "3142") {

                login.style.display = "none";
                nextStage.style.display = "block";

                nextText.textContent = `خوب اومدی.

اگر تا اینجا رسیدی، یعنی مسیر رو درست طی کردی.

اینجا فعلاً پایان این بخش از ماجراست.

مراحل بعدی این معما در آینده طراحی خواهند شد.`;

            } else {

                error.textContent = "رمز نادرست است.";
                passwordInput.value = "";
                passwordInput.focus();

            }
        }

        enterButton.addEventListener("click", checkPassword);

        passwordInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
